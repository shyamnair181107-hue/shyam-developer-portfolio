<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#080C1B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="300" fill="url(#pGrad)"/>

  <!-- Tech Grid in Circle -->
  <g opacity="0.15" stroke="#00F0FF" stroke-width="1">
    <line x1="100" y1="200" x2="500" y2="200"/>
    <line x1="100" y1="300" x2="500" y2="300"/>
    <line x1="100" y1="400" x2="500" y2="400"/>
    <line x1="200" y1="100" x2="200" y2="500"/>
    <line x1="300" y1="100" x2="300" y2="500"/>
    <line x1="400" y1="100" x2="400" y2="500"/>
  </g>

  <!-- Outer Neon Rings -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.8"/>
  <circle cx="300" cy="300" r="275" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.6"/>

  <!-- Ambient Glow in Center -->
  <circle cx="300" cy="300" r="160" fill="#8B5CF6" opacity="0.2" filter="url(#pGlow)"/>
  <circle cx="300" cy="240" r="100" fill="#00F0FF" opacity="0.15" filter="url(#pGlow)"/>

  <!-- Futuristic Monogram Silhouette -->
  <circle cx="300" cy="240" r="75" fill="#1E293B" stroke="url(#ringGrad)" stroke-width="2.5"/>
  <path d="M 180 470 C 180 370, 420 370, 420 470 Z" fill="#1E293B" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Initials SN overlay -->
  <text x="300" y="260" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="54" font-weight="bold" text-anchor="middle" letter-spacing="2">SN</text>

  <!-- Replace notice -->
  <rect x="150" y="490" width="300" height="34" rx="17" fill="#030712" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
  <text x="300" y="512" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">REPLACE WITH profile.jpg</text>
</svg>
