<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="50%" stop-color="#0E172E"/>
      <stop offset="100%" stop-color="#061E38"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Architectural Luxury Grid Lines -->
  <g opacity="0.15" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="220" r="240" fill="#00F0FF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="450" r="280" fill="#8B5CF6" opacity="0.1" filter="url(#glow)"/>

  <!-- Resort Architectural Villa Silhouette -->
  <path d="M 500 480 L 750 340 L 1100 420 L 850 560 Z" fill="#0F172A" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
  <path d="M 750 340 L 750 180 L 1100 260 L 1100 420 Z" fill="#132347" stroke="#38BDF8" stroke-width="1.5" opacity="0.85"/>
  <path d="M 500 480 L 500 320 L 750 180 L 750 340 Z" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" opacity="0.9"/>
  <!-- Penthouse glass balcony & warm lights -->
  <rect x="540" y="340" width="80" height="90" rx="4" fill="#38BDF8" opacity="0.4"/>
  <rect x="640" y="300" width="70" height="90" rx="4" fill="#FDE047" opacity="0.45"/>
  <rect x="800" y="240" width="110" height="70" rx="4" fill="#38BDF8" opacity="0.5"/>
  <rect x="940" y="280" width="110" height="70" rx="4" fill="#00F0FF" opacity="0.3"/>

  <!-- Infinity Pool Shimmer -->
  <polygon points="450,560 850,560 1150,500 750,500" fill="#0284C7" opacity="0.35"/>
  <polygon points="480,550 820,550 1080,505 740,505" fill="#38BDF8" opacity="0.4"/>

  <!-- Glassmorphic Dashboard Overlay HUD -->
  <g transform="translate(80, 100)">
    <!-- Main Card -->
    <rect width="480" height="420" rx="20" fill="#0A0F24" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <rect width="480" height="420" rx="20" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- Header badge -->
    <rect x="30" y="35" width="150" height="28" rx="14" fill="#0284C7" fill-opacity="0.2" stroke="#00F0FF" stroke-width="1"/>
    <circle cx="46" cy="49" r="4" fill="#00F0FF"/>
    <text x="58" y="53" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">GUEST PORTAL &amp; ERP</text>

    <!-- Title -->
    <text x="30" y="105" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold">GRAND AZURE</text>
    <text x="30" y="132" fill="#94A3B8" font-family="sans-serif" font-size="14">Luxury Resort Management &amp; Systems</text>

    <!-- Operational KPI Mini-Widgets -->
    <g transform="translate(30, 160)">
      <rect width="195" height="90" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" fill="#64748B" font-family="monospace" font-size="11">AVERAGE DAILY RATE</text>
      <text x="16" y="60" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold">$640.00</text>
      <text x="16" y="78" fill="#10B981" font-family="sans-serif" font-size="11">▲ +14.2% peak season</text>
    </g>

    <g transform="translate(245, 160)">
      <rect width="205" height="90" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" fill="#64748B" font-family="monospace" font-size="11">OCCUPANCY RATE</text>
      <text x="16" y="60" fill="#A855F7" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold">94.8%</text>
      <text x="16" y="78" fill="#A855F7" font-family="sans-serif" font-size="11">● 48 / 52 Rooms Ready</text>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(30, 275)">
      <rect width="130" height="26" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="14" y="17" fill="#CBD5E1" font-family="sans-serif" font-size="11">Aura AI Concierge</text>

      <rect x="140" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="154" y="17" fill="#CBD5E1" font-family="sans-serif" font-size="11">Digital Key Access</text>

      <rect x="280" width="140" height="26" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="294" y="17" fill="#CBD5E1" font-family="sans-serif" font-size="11">Housekeeping Kanban</text>
    </g>

    <!-- Status pill -->
    <g transform="translate(30, 330)">
      <rect width="420" height="50" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="24" cy="25" r="5" fill="#10B981"/>
      <text x="40" y="29" fill="#E2E8F0" font-family="monospace" font-size="12">STATUS: PRODUCTION LIVE ON VERCEL</text>
      <text x="350" y="29" fill="#00F0FF" font-family="sans-serif" font-size="12" font-weight="bold">NEXT.JS ➔</text>
    </g>
  </g>
</svg>

