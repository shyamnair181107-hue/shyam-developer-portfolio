    <text x="45" y="145" fill="#94A3B8" font-family="sans-serif" font-size="12">Institutional Tender Bond • ₹2,50,000</text>
    <rect x="270" y="115" width="115" height="24" rx="6" fill="#065F46"/>
    <text x="282" y="131" fill="#34D399" font-family="monospace" font-size="10">VALIDATED ✓</text>

    <!-- Ledger Card 2 -->
    <rect x="25" y="190" width="380" height="80" rx="12" fill="#111827" stroke="#1E293B"/>
    <text x="45" y="220" fill="#F8FAFC" font-family="monospace" font-size="13">FDR #IND-2026-4401</text>
    <text x="45" y="240" fill="#94A3B8" font-family="sans-serif" font-size="12">Earnest Money Security • ₹5,00,000</text>
    <rect x="270" y="210" width="115" height="24" rx="6" fill="#78350F"/>
    <text x="282" y="226" fill="#FCD34D" font-family="monospace" font-size="10">RENEWAL DUE ⏳</text>

    <!-- Ledger Card 3 -->
    <rect x="25" y="285" width="380" height="80" rx="12" fill="#111827" stroke="#1E293B"/>
    <text x="45" y="315" fill="#F8FAFC" font-family="monospace" font-size="13">FDR #IND-2026-7789</text>
    <text x="45" y="335" fill="#94A3B8" font-family="sans-serif" font-size="12">Performance Security Deposit • ₹1,20,000</text>
    <rect x="270" y="305" width="115" height="24" rx="6" fill="#1E3A8A"/>
    <text x="282" y="321" fill="#93C5FD" font-family="monospace" font-size="10">PROCESSING ⚙</text>

    <!-- Pipeline progress bar -->
    <g transform="translate(25, 395)">
      <text x="5" y="15" fill="#94A3B8" font-family="monospace" font-size="11">SECURITY AUDIT PROTOCOL</text>
      <rect x="0" y="26" width="380" height="8" rx="4" fill="#1E293B"/>
      <rect x="0" y="26" width="280" height="8" rx="4" fill="#3B82F6"/>
      <text x="320" y="48" fill="#38BDF8" font-family="monospace" font-size="11">74% SPEC</text>
    </g>
