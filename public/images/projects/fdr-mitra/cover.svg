<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#091329"/>
      <stop offset="100%" stop-color="#0A1E3D"/>
    </linearGradient>
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="fdrGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fdrBg)"/>

  <!-- Technical Circuit / Blueprint Lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.2">
    <path d="M 50 100 L 250 100 L 300 150 L 550 150 L 600 200 L 1150 200" fill="none"/>
    <path d="M 50 350 L 400 350 L 450 400 L 850 400 L 900 450 L 1150 450" fill="none"/>
    <path d="M 100 550 L 350 550 L 400 500 L 750 500 L 800 550 L 1100 550" fill="none"/>
    <circle cx="300" cy="150" r="4" fill="#38BDF8"/>
    <circle cx="600" cy="200" r="4" fill="#00F0FF"/>
    <circle cx="450" cy="400" r="4" fill="#38BDF8"/>
    <circle cx="900" cy="450" r="4" fill="#00F0FF"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="900" cy="250" r="250" fill="#2563EB" opacity="0.14" filter="url(#fdrGlow)"/>
  <circle cx="250" cy="450" r="220" fill="#06B6D4" opacity="0.1" filter="url(#fdrGlow)"/>

  <!-- Left Detail Panel -->
  <g transform="translate(90, 110)">
    <rect width="530" height="470" rx="24" fill="#0C1026" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="530" height="470" rx="24" fill="none" stroke="url(#blueCyanGrad)" stroke-width="1.5" opacity="0.5"/>

    <!-- SIH 2026 Badge -->
    <rect x="36" y="38" width="180" height="30" rx="15" fill="#1E3A8A" fill-opacity="0.4" stroke="#60A5FA" stroke-width="1"/>
    <circle cx="52" cy="53" r="4" fill="#60A5FA"/>
    <text x="64" y="57" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="bold">SIH 2026 INITIATIVE</text>

    <text x="36" y="115" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="bold">FDR MITRA</text>
    <text x="36" y="145" fill="#94A3B8" font-family="sans-serif" font-size="15">Fixed Deposit Receipt &amp; Security Deposit Automation</text>

    <!-- Description -->
    <text x="36" y="195" fill="#CBD5E1" font-family="sans-serif" font-size="14">
      Conceptualized to transform the manual, paper-heavy lifecycle
    </text>
    <text x="36" y="220" fill="#CBD5E1" font-family="sans-serif" font-size="14">
      of earnest money security deposits and bank guarantees.
    </text>
    <text x="36" y="245" fill="#CBD5E1" font-family="sans-serif" font-size="14">
      Enforces automated tenure alerts, audits, and refund triggers.
    </text>

    <!-- Tech tags -->
    <g transform="translate(36, 280)">
      <rect width="90" height="28" rx="6" fill="#1E293B"/>
      <text x="14" y="18" fill="#60A5FA" font-family="monospace" font-size="11">Next.js</text>

      <rect x="100" width="105" height="28" rx="6" fill="#1E293B"/>
      <text x="114" y="18" fill="#38BDF8" font-family="monospace" font-size="11">TypeScript</text>

      <rect x="215" width="100" height="28" rx="6" fill="#1E293B"/>
      <text x="229" y="18" fill="#2DD4BF" font-family="monospace" font-size="11">Tailwind</text>

      <rect x="325" width="125" height="28" rx="6" fill="#1E293B"/>
      <text x="339" y="18" fill="#C084FC" font-family="monospace" font-size="11">Workflow API</text>
    </g>

    <!-- In Development Warning / Status Box -->
    <g transform="translate(36, 350)">
      <rect width="458" height="75" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6 4"/>
      <circle cx="28" cy="38" r="6" fill="#F59E0B"/>
      <text x="46" y="32" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="bold">STATUS: IN ACTIVE DEVELOPMENT</text>
      <text x="46" y="54" fill="#94A3B8" font-family="sans-serif" font-size="12">Hackathon engineering phase • SIH 2026 Problem Statement track</text>
    </g>
  </g>

  <!-- Right Side Interactive Ledger Wireframe -->
  <g transform="translate(670, 110)">
